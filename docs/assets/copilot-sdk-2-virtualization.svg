<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Virtualize the agent environment</title>
  <desc id="desc">The application routes a session's model loop to app-owned tools or to tools that operate in an isolated sandbox.</desc>
  <rect width="1080" height="470" rx="18" fill="#0d1117"/>
  <text x="40" y="52" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Separate where the agent thinks from where it acts</text>
  <rect x="42" y="170" width="170" height="115" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="127" y="214" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Your app</text>
  <text x="127" y="242" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="15">Auth + routing</text>
  <path d="M212 228 H294" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="302" y="145" width="320" height="165" rx="13" fill="#111820" stroke="#3fb950" stroke-width="2"/>
  <text x="462" y="184" text-anchor="middle" fill="#7ee787" font-family="Arial, sans-serif" font-size="19" font-weight="700">Shared runtime</text>
  <text x="462" y="219" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="16">Session identity + history</text>
  <text x="462" y="248" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="16">Model loop (agent thinks)</text>
  <text x="462" y="280" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">Per-session tools and policy</text>
  <path d="M622 208 H708 V134 H766" fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M622 247 H708 V336 H766" fill="none" stroke="#d2a8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="776" y="76" width="258" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="905" y="112" text-anchor="middle" fill="#79c0ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">App-owned APIs</text>
  <text x="905" y="142" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="15">Custom tools / MCP</text>
  <text x="905" y="168" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">No host shell or files</text>
  <rect x="776" y="276" width="258" height="120" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="905" y="312" text-anchor="middle" fill="#d2a8ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Isolated sandbox</text>
  <text x="905" y="342" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="15">Shell + filesystem</text>
  <text x="905" y="368" text-anchor="middle" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">For work that needs isolation</text>
  <text x="540" y="442" text-anchor="middle" fill="#ffdf5d" font-family="Arial, sans-serif" font-size="15">The app owns routing and authorization; a shared runtime is not a sandbox.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
